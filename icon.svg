<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="Memory Link">
  <title>Memory Link — 三源汇入一节点</title>
  <!-- three left-hand source nodes -->
  <circle cx="14" cy="16" r="6" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="14" cy="32" r="6" stroke="currentColor" stroke-width="2.4"/>
  <circle cx="14" cy="48" r="6" stroke="currentColor" stroke-width="2.4"/>
  <!-- converging strokes into a single relay node -->
  <path d="M20 16 L40 28" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M20 32 L40 32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M20 48 L40 36" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
  <!-- central federated node -->
  <circle cx="46" cy="32" r="8" stroke="currentColor" stroke-width="2.4"/>
  <!-- single read-only output -->
  <path d="M54 32 L60 32" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg>
